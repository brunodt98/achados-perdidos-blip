[theme]
base = "light"
primaryColor = "#B20000"
backgroundColor = "#F7F4EE"
secondaryBackgroundColor = "#EFEAE1"
textColor = "#1B1917"
borderColor = "#DDD6CA"
baseRadius = "10px"
font = "Instrument Sans:https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 12

[browser]
gatherUsageStats = false
